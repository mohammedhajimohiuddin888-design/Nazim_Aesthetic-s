<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline · NAZIM Fine Jewellery</title>
  <meta name="theme-color" content="#1C1917">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #FAF8F5;
      color: #1C1917;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: #FFFFFF;
      border: 1px solid #E8DFC8;
      border-radius: 4px;
      padding: 36px 28px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 10px 25px -5px rgba(28, 25, 23, 0.05);
    }
    .logo-img {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: 2px solid #C5A059;
      box-shadow: 0 4px 12px rgba(197, 160, 89, 0.25);
      margin: 0 auto 20px;
      display: block;
    }
    .kicker {
      font-size: 11px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #8F6E2B;
      font-weight: 600;
      margin-bottom: 8px;
    }
    h1 {
      font-family: Georgia, serif;
      font-size: 26px;
      font-weight: 500;
      color: #1C1917;
      margin-bottom: 12px;
      line-height: 1.25;
    }
    p {
      font-size: 14px;
      color: #57534E;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .btn {
      display: inline-block;
      width: 100%;
      background: #1C1917;
      color: #FAF8F5;
      text-decoration: none;
      padding: 13px 20px;
      border-radius: 2px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.05em;
      border: none;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #332D27;
    }
    .info {
      margin-top: 24px;
      padding-top: 18px;
      border-top: 1px solid #F5EFE4;
      font-size: 12px;
      color: #78716C;
    }
    .info strong {
      color: #8E2333;
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="/icon-192.png" alt="NAZIM Jewellery" class="logo-img">
    <div class="kicker">Charminar · Hyderabad</div>
    <h1>You are Currently Offline</h1>
    <p>Please check your internet connection to browse our latest Chandbali, Karan Phool collections, and place direct WhatsApp orders.</p>
    <button class="btn" onclick="window.location.reload()">Retry Connection</button>
    <div class="info">
      <div><strong>Stall No. 10</strong> · Charminar Heritage Walkway</div>
      <div>Helpline: +91 81216 04194</div>
    </div>
  </div>
</body>
</html>
